openapi: 3.0.1
info:
  title: Lanches Caieiras
  description: 'Gerenciador de Pedidos, Ordem de Preparo, Produtos e Pagamento da Lanches Caieiras'
  contact:
    email: titoparizotto@gmail.com
    name: Tito de Morais Parizotto
  version: 2.1.0
servers:
  - url: 'http://localhost:8080/v2'
tags:
  - name: Customers
  - name: CustomerOrders
  - name: FoodItems
  - name: KitchenOrders
  - name: Notifications
  - name: Payments
  - name: CollectionOperations
    description: Operações que utilizam arquétipos de coleções
  - name: ManagedOperations
    description: Operações que utilizam arquétipos gerenciáveis
paths:
