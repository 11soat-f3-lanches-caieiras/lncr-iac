    get:
      operationId: getListCustomerOrders
      description: Buscar Lista de Pedidos de Clientes por lista de status
      summary: |
        Buscar lista de Pedidos de clientes por lista de status que serão ordenados pela ordem de status informados.
        Exemplo: Informando a lista Ready,Preparing,Received,Checkout,Cancelled
        Retornará uma lista ordenando na sequência dos status informados.
        Dentro de cada status as ordens estarão ordenadas do mais antigo para o mais atual
