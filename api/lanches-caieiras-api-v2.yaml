      operationId: partialUpdateCustomerId
      description: Atualizar parcialmente os dados de um cliente
      summary: Atualizar parcialmente os dados de um cliente
      tags:
        - Customers
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        $ref: '#/components/requestBodies/PartialUpdateCustomer'
      responses:
        '200':
          $ref: '#/components/responses/PartialUpdateCustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
