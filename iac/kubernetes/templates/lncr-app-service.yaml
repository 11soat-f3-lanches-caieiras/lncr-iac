apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  
  labels:
    app: {{ .Values.app.name }}
spec:
    type: {{ .Values.service.lb.type | default "LoadBalancer" }}
    ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
          name: http
    selector:
        app: {{ .Values.app.name }}

