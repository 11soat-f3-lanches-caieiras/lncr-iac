name: Bootstrap Infrastructure

env:
  TERRAFORM_VERSION: 1.5.7

on:
  workflow_dispatch:

jobs:
  foundation:
    name: Deploy Foundation (VPC + CodeBuild)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Init
      run: terraform init

    - name: Deploy Foundation
      run: |
        terraform apply \
          -target=module.vpc \
          -target=module.codebuild \
          -var-file="prd.tfvars" \
          -auto-approve

    - name: Output CodeBuild Name
      run: |
        echo "CodeBuild project created: $(terraform output -raw codebuild_project_name)"
        echo "Update your main workflow to use this CodeBuild project"

